
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Send Us a Message</title>
    <link rel="stylesheet" href="style.css">
</head>

    

<body>

    <div class="container">

        <h1>Send Us a Message</h1>

        <h3>
            Fill in the form below and we'll get back to you as soon as possible.
        </h3>

        <form action="https://api.web3forms.com/submit" method="POST">
        <input type="hidden" name="access_key" value="060c3bcc-3f83-4742-bd3e-c0cab874b8b4">


            <!-- Disable FormSubmit CAPTCHA -->
            <input type="hidden" name="_captcha" value="false">

            <!-- Subject of the email -->
            <input type="hidden" name="_subject" value="New Contact Form Message">

            <div class="form-group">

                <div class="form-row">

                    <!-- Full Name -->
                    <div class="col">
                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            placeholder="Full Name"
                            required
                        >
                    </div>

                    <!-- Email -->
                    <div class="col">
                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            placeholder="Email Address"
                            required
                        >
                    </div>

                </div>

            </div>

            <div class="form-group">

                <div class="form-row">

                    <!-- Phone Number -->
                    <div class="col">
                        <input
                            type="tel"
                            name="phone"
                            class="form-control"
                            placeholder="Phone Number"
                            required
                        >
                    </div>

                    <!-- Subject -->
                    <div class="col">
                        <input
                            type="text"
                            name="subject"
                            class="form-control"
                            placeholder="Subject"
                            required
                        >
                    </div>

                </div>

            </div>

            <!-- Message -->
            <div class="form-group">

                <textarea
                    placeholder="Your Message"
                    class="form-control"
                    name="message"
                    rows="10"
                    required
                ></textarea>

            </div>

            <!-- Submit -->
            <button
                type="submit"
                class="btn btn-lg btn-dark btn-block"
            >
                Submit Form
            </button>

        </form>

    </div>

</body>

</html>
