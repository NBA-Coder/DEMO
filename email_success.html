
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Form Submitted</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="success-box">

        <div class="check">✓</div>

        <h1>Form Submitted Successfully!</h1>

        <p>
            Thank you for contacting us. We have received your message
            and will get back to you soon.
        </p>

        <a href="/">Back to Home</a>

    </div>

</body>
</html>




<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;

    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;
}

.success-box {
    background: white;
    width: 100%;
    max-width: 500px;

    text-align: center;

    padding: 40px 30px;

    border-radius: 10px;

    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
}

.check {
    width: 65px;
    height: 65px;

    margin: 0 auto 20px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #046307;
    color: white;

    border-radius: 50%;

    font-size: 35px;
}

.success-box h1 {
    color: #046307;
    font-size: 28px;
    margin-bottom: 15px;
}

.success-box p {
    color: #555;
    line-height: 1.6;
    margin-bottom: 25px;
}

.success-box a {
    display: inline-block;

    padding: 12px 25px;

    background: #046307;
    color: white;

    text-decoration: none;

    border-radius: 6px;
}

.success-box a:hover {
    background: #034705;
}



</style>
