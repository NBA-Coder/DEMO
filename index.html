
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us</title>


    
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .contact-container {
            width: 100%;
            max-width: 650px;
            background: #ffffff;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .contact-container h1 {
            color: #046307;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .contact-container p {
            color: #666;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #046307;
            box-shadow: 0 0 0 3px rgba(4, 99, 7, 0.08);
        }

        .form-group textarea {
            min-height: 150px;
            resize: vertical;
        }

        .send-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #046307;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .send-btn:hover {
            background: #034705;
            transform: translateY(-1px);
        }

        .send-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        #status {
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
            display: none;
        }

        @media (max-width: 600px) {
            .contact-container {
                padding: 25px 20px;
            }

            .contact-container h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

    <div class="contact-container">

        <h1>Send Us a Message</h1>

        <p>
            Fill in the form below and we'll get back to you as soon as possible.
        </p>


<form action="https://formsubmit.co/adetunjimn@gmail.com" method="POST">

    <!-- Redirect to success page after submission -->
    <input type="hidden" name="_next" value="email_success.html">

    <!-- Disable FormSubmit CAPTCHA -->
    <input type="hidden" name="_captcha" value="false">

    <!-- Honeypot spam protection -->
    <input type="text" name="_honey" style="display:none">


    <div class="form-group">
        <label for="name">Full Name</label>

        <input 
            type="text"
            id="name"
            name="name"
            placeholder="Enter your full name"
            required
        >
    </div>


    <div class="form-group">
        <label for="email">Email Address</label>

        <input 
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
        >
    </div>


    <div class="form-group">
        <label for="phone">Phone Number</label>

        <input 
            type="tel"
            id="phone"
            name="phone"
            placeholder="Enter your phone number"
            required
        >
    </div>


    <div class="form-group">
        <label for="subject">Subject</label>

        <input 
            type="text"
            id="subject"
            name="subject"
            placeholder="What is this about?"
            required
        >
    </div>


    <div class="form-group">
        <label for="message">Message</label>

        <textarea
            id="message"
            name="message"
            placeholder="Write your message..."
            required
        ></textarea>
    </div>


    <button type="submit" class="send-btn">
        Send Message
    </button>

</form>


    </div>


   

</body>
</html>
